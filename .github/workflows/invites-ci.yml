#
# CI for the digital invitation platform (invites/). The spa's own workflow
# covers the repo root; this one only runs when something under invites/
# changes.
#
name: Invites CI

on:
  push:
    branches: [main]
    paths: ['invites/**', '.github/workflows/invites-ci.yml']
  pull_request:
    paths: ['invites/**', '.github/workflows/invites-ci.yml']

concurrency:
  group: invites-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invites

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invites
          POSTGRES_PASSWORD: invites
          POSTGRES_DB: invites_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U invites"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://invites:invites@localhost:5432/invites_test?schema=public
      DIRECT_URL: postgresql://invites:invites@localhost:5432/invites_test?schema=public
      # CI-only secret; never used outside the ephemeral runner.
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret-value

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: invites/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:local

      - name: Seed, then check the data reconciles with itself
        run: |
          npm run db:seed
          npm run verify

      # The pages that must never 500: the landing page, the demo invitation,
      # a personal guest link, the RSVP endpoint and the sign-in page.
      - name: Smoke-test the running app
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/login && break
            sleep 1
          done
          set -e
          curl -sf -o /dev/null http://127.0.0.1:3000/
          curl -sf -o /dev/null http://127.0.0.1:3000/templates
          curl -sf -o /dev/null http://127.0.0.1:3000/i/juan-and-maria
          curl -sf -o /dev/null http://127.0.0.1:3000/i/juan-and-maria/calendar.ics
          curl -sf -o /dev/null http://127.0.0.1:3000/i/juan-and-maria/card
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/i/does-not-exist)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/admin)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"slug":"juan-and-maria","name":"CI Bot","response":"ACCEPT","seats":1}' http://127.0.0.1:3000/api/public/rsvp)" = "200"
