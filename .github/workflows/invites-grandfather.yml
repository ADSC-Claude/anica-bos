#
# Gives back the features an invitation was sold with and lost when they moved
# up a package.
#
# #127 added Luxury and moved the seating chart, event-day check-in and the
# shared album from Signature up to it. An invitation's features are worked out
# from its tier every time a page renders, so every Signature invitation sold
# before that lost all three the moment it deployed — no warning to the
# customer and no record of it anywhere.
#
# This finds them and writes the add-on codes that grant the features back onto
# the invitation, which is the same thing the checkout writes when somebody buys
# one. It deletes nothing, it touches no prices, and it is safe to run twice: an
# invitation that has the features is no longer owed them. Every write is in the
# audit log as `sensitive`.
#
# What it cannot do, it says. The shared album has no add-on behind it, so an
# invitation that lost that is listed and left alone — putting it back is a
# decision about what is for sale, not a line in a script.
#
# Like the pricing run it defaults to a dry run, because reading the list of
# customers first costs nothing.
#
# Setup, once: Settings → Secrets and variables → Actions → New repository secret
#   INVITES_DIRECT_URL   Supabase → Connect → Session pooler (port 5432)
#
# Not DIRECT_URL: that secret belongs to the spa and points at a different
# database.
#
name: Give back the features that moved

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what was lost without giving anything back.'
        required: false
        default: true
        type: boolean
      schema:
        description: 'Which schema to write to.'
        required: true
        default: invites
        type: string

concurrency:
  group: invites-grandfather
  cancel-in-progress: false

jobs:
  grandfather:
    name: Give back
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invites

    env:
      DATABASE_SCHEMA: ${{ inputs.schema }}
      DATABASE_URL: ${{ secrets.INVITES_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.INVITES_DIRECT_URL }}

    steps:
      # Before actions/checkout, so it runs at the workspace root — `invites`
      # does not exist yet, and a step inheriting the job's working-directory
      # cannot start there at all.
      - name: Refuse a schema that is not ours
        if: inputs.schema == 'public' || inputs.schema == ''
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::Refusing to write to '$DATABASE_SCHEMA'."
          echo "'public' belongs to the spa on this database. The invitations app uses its own schema."
          exit 1

      - name: Check the secret is present
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::The INVITES_DIRECT_URL repository secret is not set."
            echo "Add it under Settings → Secrets and variables → Actions,"
            echo "using the Supabase Session pooler string (port 5432)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: invites/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      # Through scripts/migrate.mjs, which knows about DATABASE_SCHEMA. The bare
      # CLI does not, and would migrate into `public`.
      - name: Apply migrations
        run: npm run db:deploy

      # Spelled out in the shell rather than as `${{ dry_run && '' || '--apply' }}`.
      # An empty string is falsy in a GitHub expression, so the tidy one-liner
      # reads "dry run" and passes --apply: the inverted form of the trick the
      # pricing workflow can safely use, where the true branch is a non-empty
      # flag. A dry run that writes to the live database is not a bug anybody
      # gets to find twice.
      - name: Give back what was lost
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then
            npm run grandfather
          else
            npm run grandfather -- --apply
          fi

      - name: Say what landed
        run: |
          {
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "### Dry run against \`$DATABASE_SCHEMA\`"
              echo
              echo "Nothing was written. The step above lists every invitation that lost"
              echo "something it was sold, and what a real run would give back."
              echo "Re-run with **dry_run** unticked to apply it."
            else
              echo "### Features given back on \`$DATABASE_SCHEMA\`"
              echo
              echo "See the step above for who got what. Every write is in the audit log."
              echo "- A customer's own invitation: \`/account\`"
              echo "- Anything the step says it could not put back needs a decision, not a re-run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
